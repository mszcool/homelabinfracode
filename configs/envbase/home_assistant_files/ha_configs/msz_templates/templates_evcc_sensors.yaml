# ======================================================================
# Guarded grid consumption (import) energy (kWh, lifetime cumulative).
#
# Wraps the EVCC site-level grid IMPORT counter
# (sensor.evcc_evcc_grid_energy, topic evcc/site/grid/energy) with the
# same monotonic + max-step + startup-bootstrap guards as the per-
# inverter sensors. Grid EXPORT is Riemann-integrated separately (see
# sensors_evcc_riemann.yaml). max_step = 10 kWh. Keeps the original
# unique_id so the Energy Dashboard and statistics history are kept.
#
# Recovery (legitimate counter reset): clear the retained MQTT message
#   mosquitto_pub -h <broker> -t evcc/site/grid/energy -r -n
# then restart Home Assistant.
# ======================================================================
- trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.evcc_evcc_grid_energy
    - platform: time_pattern
      minutes: "/5"
  sensor:
    - name: EVCC Grid Consumption Energy
      unique_id: evcc_grid_consumption_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      availability: >
        {% set raw = states('sensor.evcc_evcc_grid_energy') | float(none) %}
        {{ raw is not none or (this.state | float(none)) is not none }}
      state: >
        {% set raw      = states('sensor.evcc_evcc_grid_energy') | float(none) %}
        {% set prev     = this.state | float(none) %}
        {% set max_step = 10.0 %}
        {% set bt       = this.attributes.get('boot_time') %}
        {% set boot     = trigger.platform == 'homeassistant'
                          or (bt and as_datetime(bt) is not none
                              and (now() - as_datetime(bt)).total_seconds() < 600) %}
        {% if raw is none %}
          {{ prev if prev is not none else 'unknown' }}
        {% elif prev is none %}
          {{ raw | round(3) }}
        {% elif raw < prev %}
          {{ prev | round(3) }}
        {% elif (raw - prev) > max_step and not boot %}
          {{ prev | round(3) }}
        {% else %}
          {{ raw | round(3) }}
        {% endif %}
      attributes:
        boot_time: >
          {% if trigger.platform == 'homeassistant' %}
            {{ now().isoformat() }}
          {% else %}
            {{ this.attributes.get('boot_time', '') }}
          {% endif %}

# ======================================================================

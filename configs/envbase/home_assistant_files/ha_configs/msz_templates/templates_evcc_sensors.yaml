# (see sensors_evcc_riemann.yaml). max_step = 5 kWh (hybrid inverters
# cannot push more than ~5 kW into the battery). Keeps the original
# unique_id so the Energy Dashboard and statistics history are kept.
#
# Recovery (legitimate counter reset, e.g. battery swap):
#   mosquitto_pub -h <broker> -t evcc/site/battery/energy -r -n

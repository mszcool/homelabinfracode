# EVCC-derived helper sensors for the Home Assistant Energy Dashboard.
#
# Source topics (published by EVCC, mapped to MQTT entities in
# msz_mqtt_sensors/mqtt_evcc_sensors.yaml). Note the doubled `evcc_`
# prefix: HA derives the entity_id from device name ("EVCC") + entity
# name ("EVCC ...").
#
#   sensor.evcc_evcc_grid_power              evcc/site/grid/power     (W, +import / -export)
#   sensor.evcc_evcc_battery_power           evcc/site/battery/power  (W, +discharge / -charge)
#   sensor.evcc_evcc_pv_power_total          evcc/site/pvPower        (W, >= 0)
#   sensor.evcc_evcc_pv_inverter_1_energy    evcc/site/pv/1/energy    (kWh, total_increasing)
#   sensor.evcc_evcc_pv_inverter_2_energy    evcc/site/pv/2/energy    (kWh, total_increasing)
#   sensor.evcc_evcc_grid_energy             evcc/site/grid/energy    (kWh, total_increasing, import only)
#   sensor.evcc_evcc_battery_energy          evcc/site/battery/energy (kWh, total_increasing, charge only)
#
# Sign conventions (https://docs.evcc.io/en/docs/integrations/mqtt-api):
#   grid/power      positive = import from grid
#   battery/power   positive = discharge from battery
#   pvPower         always >= 0
#
# Power-split wrappers below (Grid Export Power, Battery Charge/Discharge
# Power) feed the Energy Dashboard via Riemann integrations in
# msz_sensors/sensors_evcc_riemann.yaml -- needed only for grid EXPORT
# and battery DISCHARGE, because EVCC publishes cumulative kWh counters
# only for grid IMPORT and battery CHARGE.
#
# For energy slots backed by EVCC's native cumulative counters the
# dashboard MUST consume the guarded wrappers below
# (`sensor.evcc_pv_production_energy_calculated`,
# `sensor.evcc_grid_consumption_energy`,
# `sensor.evcc_battery_charge_energy`), NOT the raw MQTT entities. The
# raw entities are unguarded and a single bad EVCC publish (e.g. one
# inverter or the meter momentarily reporting zero on a Modbus timeout)
# is locked into HA's long-term statistics as either a phantom meter
# reset (-> huge spike) or a permanent stuck-high value.

- sensor:
    - name: EVCC Grid Export Power
      unique_id: evcc_grid_export_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      availability: >
        {{ states('sensor.evcc_evcc_grid_power') not in ['unknown', 'unavailable', 'none', ''] }}
      state: >
        {% set p = states('sensor.evcc_evcc_grid_power') | float(0) %}
        {{ [-p, 0] | max | round(0) }}

    - name: EVCC Battery Charge Power
      unique_id: evcc_battery_charge_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      availability: >
        {{ states('sensor.evcc_evcc_battery_power') not in ['unknown', 'unavailable', 'none', ''] }}
      state: >
        {% set p = states('sensor.evcc_evcc_battery_power') | float(0) %}
        {{ [-p, 0] | max | round(0) }}

    - name: EVCC Battery Discharge Power
      unique_id: evcc_battery_discharge_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      availability: >
        {{ states('sensor.evcc_evcc_battery_power') not in ['unknown', 'unavailable', 'none', ''] }}
      state: >
        {% set p = states('sensor.evcc_evcc_battery_power') | float(0) %}
        {{ [p, 0] | max | round(0) }}

    # ------------------------------------------------------------------
    # PV production energy for the Energy Dashboard (kWh, lifetime
    # cumulative) = sum of the two guarded per-inverter counters
    # (sensor.evcc_pv_inverter_1_energy_guarded and
    # sensor.evcc_pv_inverter_2_energy_guarded, defined as trigger-based
    # sensors further below).
    #
    # Both inputs are already monotonically clamped, so their sum is
    # monotonic and needs no additional guard here. Holds its previous
    # value whenever either guarded input is momentarily non-numeric so
    # it never falls back to a single inverter's value, which HA's
    # total_increasing statistics engine would otherwise record as a
    # phantom meter reset.
    #
    # Keeps the original unique_id so the Energy Dashboard binding and
    # the long-term statistics history are preserved. Add a third
    # guarded inverter sensor below and include it here if the PV array
    # is extended.
    # ------------------------------------------------------------------
    - name: EVCC PV Production Energy Calculated
      unique_id: evcc_pv_production_energy_calculated
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      availability: >
        {% set g1 = states('sensor.evcc_pv_inverter_1_energy_guarded') | float(none) %}
        {% set g2 = states('sensor.evcc_pv_inverter_2_energy_guarded') | float(none) %}
        {{ (g1 is not none and g2 is not none) or (this.state | float(none)) is not none }}
      state: >
        {% set g1   = states('sensor.evcc_pv_inverter_1_energy_guarded') | float(none) %}
        {% set g2   = states('sensor.evcc_pv_inverter_2_energy_guarded') | float(none) %}
        {% set prev = this.state | float(none) %}
        {% if g1 is none or g2 is none %}
          {{ prev if prev is not none else 'unknown' }}
        {% else %}
          {{ (g1 + g2) | round(3) }}
        {% endif %}

# ======================================================================
# Guarded per-inverter PV lifetime energy counters (trigger-based).
#
# Each wraps one inverter's lifetime kWh Modbus counter. Trigger-based
# so the guard can tell a Home Assistant restart apart from an ordinary
# source update. Two guards:
#
#   1) Monotonic clamp (always on): reject any sample below the held
#      value, so a single-poll Modbus zero/dropout can never be recorded
#      by HA's total_increasing statistics as a phantom meter reset.
#
#   2) Max-step clamp (steady state only, 10 kWh): reject an upward jump
#      larger than max_step, so a bogus high reading (e.g. a Wh-vs-kWh
#      unit mismatch) cannot be latched in and freeze the counter.
#
# Startup bootstrap: for 10 minutes after the `homeassistant` start
# event the max-step clamp is bypassed (the monotonic clamp stays on),
# letting the counter re-sync to the true lifetime value after an HA
# outage even when the accumulated gap exceeds max_step. The window is
# tracked in the `boot_time` attribute -- keyed on elapsed time rather
# than the start trigger alone, because the retained MQTT counter is
# redelivered a few seconds AFTER the start event fires. A plain
# template reload (no restart) self-heals instead via the cold-start
# branch, which accepts the first raw sample unconditionally.
#
# The summed dashboard sensor (EVCC PV Production Energy Calculated)
# lives in the state-based block above.
# ======================================================================
- trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.evcc_evcc_pv_inverter_1_energy
    - platform: time_pattern
      minutes: "/5"
  sensor:
    - name: EVCC PV Inverter 1 Energy Guarded
      unique_id: evcc_pv_inverter_1_energy_guarded
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      availability: >
        {% set raw = states('sensor.evcc_evcc_pv_inverter_1_energy') | float(none) %}
        {{ raw is not none or (this.state | float(none)) is not none }}
      state: >
        {% set raw      = states('sensor.evcc_evcc_pv_inverter_1_energy') | float(none) %}
        {% set prev     = this.state | float(none) %}
        {% set max_step = 10.0 %}
        {% set bt       = this.attributes.get('boot_time') %}
        {% set boot     = trigger.platform == 'homeassistant'
                          or (bt and as_datetime(bt) is not none
                              and (now() - as_datetime(bt)).total_seconds() < 600) %}
        {% if raw is none %}
          {{ prev if prev is not none else 'unknown' }}
        {% elif prev is none %}
          {{ raw | round(3) }}
        {% elif raw < prev %}
          {{ prev | round(3) }}
        {% elif (raw - prev) > max_step and not boot %}
          {{ prev | round(3) }}
        {% else %}
          {{ raw | round(3) }}
        {% endif %}
      attributes:
        boot_time: >
          {% if trigger.platform == 'homeassistant' %}
            {{ now().isoformat() }}
          {% else %}
            {{ this.attributes.get('boot_time', '') }}
          {% endif %}


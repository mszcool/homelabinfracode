---
# Base (shared) vendor-neutral network-fabric schema
#
# This is the UniFi/pfSense counterpart to group_vars/mainrouter/networking-foundation.yaml
# (which stays MikroTik-specific and is preserved unchanged for rollback/legacy).
#
# The schema is an INTENT model: zones, DHCP/DNS, reservations, firewall policy,
# wired port profiles and WLANs. A per-vendor translator compiles it to concrete
# API calls (UniFi now; pfSense later). Both derive their IPs from the SAME
# common-seeds.yaml (ip_plan_*), so there is a single source of truth during and
# after the migration.
#
# Required seed variables (from common-seeds.yaml):
#   localdomain, ad_domain_short
#   ip_plan_external_dns_servers          external forwarders
#   ip_plan_vlans                         per-zone {vlan_id, subnet, gateway,
#                                         dhcp_from, dhcp_to}
#   ip_plan_hosts                         infrastructure host IPs (broker, evcc,
#                                         samba4_addc, pool_remote_access, ...)
#
# Provided by the environment overlay (<env>/.../network_fabric/networking-foundation.yaml):
#   devices_mapped                        MAC->IP reservations + DNS names
#   wlans                                 concrete SSID names + PSK secret refs
#   unifi_console_*                       controller connection details
#
# Consumed by playbooks (hosts: network_fabric / unifi):
#   playbooks/ring0a/networking-unifi-continuous-configure-all.yaml

# ---------- Shared constants ----------

# UniFi site shortname (the default site is literally "default"; overlays may override).
fabric_site_name: "default"

# ---------- Zones (L3 networks / VLANs) ----------
# Vendor-neutral replacement for the MikroTik `networks` list, minus RouterOS
# interface plumbing. Subnets/gateways/pools come from ip_plan_vlans seeds.
#
# firewall_zone    UniFi firewall zone this network belongs to; built-in zones
#                  (Internal, Hotspot, External) are reused by name. kids+media
#                  share the custom "KidsMedia" zone (intra-zone print/music/cast)
# isolated         client isolation within the network (guest)
# internet         whether the zone may reach the internet at all
# mdns             reflect mDNS/SSDP toward the Media zone (never into IoT)

default_net_name: "mgmt"

net_zones:
  - name: "{{ default_net_name }}"
    description: "Management (gateway, APs, switches, MoCA UIs)"
    deprecated: false
    firewall_zone: "Mgmt"
    vlan_id: "{{ ip_plan_vlans.mgmt.vlan_id }}"
    subnet: "{{ ip_plan_vlans.mgmt.subnet }}"
    gateway: "{{ ip_plan_vlans.mgmt.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.mgmt.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.mgmt.dhcp_to }}"
      lease: 86400

  - name: "trusted"
    description: "Trusted user devices (unfiltered)"
    deprecated: false
    firewall_zone: "Internal"
    vlan_id: "{{ ip_plan_vlans.trusted.vlan_id }}"
    subnet: "{{ ip_plan_vlans.trusted.subnet }}"
    gateway: "{{ ip_plan_vlans.trusted.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.trusted.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.trusted.dhcp_to }}"
      lease: 86400

  - name: "kids"
    description: "Kids devices (content filtered + bedtime schedule)"
    deprecated: false
    firewall_zone: "KidsMedia"
    vlan_id: "{{ ip_plan_vlans.kids.vlan_id }}"
    subnet: "{{ ip_plan_vlans.kids.subnet }}"
    gateway: "{{ ip_plan_vlans.kids.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.kids.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.kids.dhcp_to }}"
      lease: 86400

  - name: "guest"
    description: "Guest network (internet only; isolation via the Hotspot zone)"
    deprecated: false
    firewall_zone: "Hotspot"
    vlan_id: "{{ ip_plan_vlans.guest.vlan_id }}"
    subnet: "{{ ip_plan_vlans.guest.subnet }}"
    gateway: "{{ ip_plan_vlans.guest.gateway }}"
    domain_name: "{{ localdomain }}"
    # Network-level isolate must be OFF to join Hotspot; the Hotspot zone then
    # blocks guest -> all internal zones. WLAN client_isolation stays on (L2).
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.guest.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.guest.dhcp_to }}"
      lease: 3600

  - name: "media"
    description: "Discoverable consumer devices (TVs, speakers, printers, casting)"
    deprecated: false
    firewall_zone: "KidsMedia"
    vlan_id: "{{ ip_plan_vlans.media.vlan_id }}"
    subnet: "{{ ip_plan_vlans.media.subnet }}"
    gateway: "{{ ip_plan_vlans.media.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: true
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.media.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.media.dhcp_to }}"
      lease: 86400

  - name: "servers"
    description: "Server estate (Incus infra + IoT-servers, flat)"
    deprecated: false
    firewall_zone: "Servers"
    vlan_id: "{{ ip_plan_vlans.servers.vlan_id }}"
    subnet: "{{ ip_plan_vlans.servers.subnet }}"
    gateway: "{{ ip_plan_vlans.servers.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.servers.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.servers.dhcp_to }}"
      lease: 86400

  - name: "iot"
    description: "IoT devices (all get internet; broker-only into servers)"
    deprecated: false
    firewall_zone: "IoT"
    vlan_id: "{{ ip_plan_vlans.iot.vlan_id }}"
    subnet: "{{ ip_plan_vlans.iot.subnet }}"
    gateway: "{{ ip_plan_vlans.iot.gateway }}"
    domain_name: "{{ localdomain }}"
    isolated: false
    internet: true
    mdns: false
    dhcp:
      enabled: true
      pool_from: "{{ ip_plan_vlans.iot.dhcp_from }}"
      pool_to: "{{ ip_plan_vlans.iot.dhcp_to }}"
      lease: 86400

# ---------- Firewall zones (UniFi zone-based grouping) ----------
# The playbook only creates entries that are neither `builtin` nor `deprecated`;
# networks join a zone via their own `zoneId`. Built-in zones are reused by NAME:
#   trusted -> Internal      guest -> Hotspot      internet/gateway -> External
# (guest must have network isolate OFF to join Hotspot; the Hotspot zone then
#  blocks guest -> all internal zones.)
# They are listed below with `builtin: true` FOR REFERENCE ONLY — the playbook
# never creates, modifies or deletes them. Kids + Media share the custom
# "KidsMedia" zone so kids<->media (printing/music/casting) is automatic
# intra-zone traffic and the content toggle stays one rule.
#
# The Trusted/Guest/Filtered entries are the OLD custom zones, kept with
# `deprecated: true` so they are deleted once their networks have moved to the
# built-in / renamed zones. Remove them from this list after a cleanup run.
fabric_firewall_zones:
  # -- Custom zones the playbook manages --
  - name: "Mgmt"
    networks: ["mgmt"]
    deprecated: false
  - name: "KidsMedia"
    networks: ["kids", "media"]
    deprecated: false
  - name: "Servers"
    networks: ["servers"]
    deprecated: false
  - name: "IoT"
    networks: ["iot"]
    deprecated: false

  # -- Built-in UniFi zones (reference only; builtin:true => never touched) --
  - name: "Internal"
    networks: ["trusted"]
    builtin: true
    deprecated: false
  - name: "Hotspot"
    networks: ["guest"]   # guest reuses Hotspot (isolation via the zone, isolate flag OFF)
    builtin: true
    deprecated: false
  - name: "External"
    networks: []          # internet / gateway rules resolve here
    builtin: true
    deprecated: false
  - name: "Gateway"
    networks: []
    builtin: true
    deprecated: false
  - name: "Vpn"
    networks: []
    builtin: true
    deprecated: false
  - name: "Dmz"
    networks: []
    builtin: true
    deprecated: false

# ---------- Firewall policy (intent) ----------
# Inter-zone default is deny (UniFi ZBF); stateful established/related, masquerade
# and the WAN drop-all baseline are implicit. Rules express only what to ALLOW
# (plus the explicit IoT->Servers deny that sits after the broker allow).
#
# Rule fields (any subset):
#   from / to            zone names (or "internet")
#   from_networks        restrict source to specific net_zone name(s) within zone
#   from_hosts / to_hosts  specific host IPs (seed-derived)
#   ports / proto        L4 match
#   paused               true = create the rule disabled (UI "Pause"); toggle on demand
#   action               allow | deny
#   temporary            annotate rules to remove at a known milestone
#   deprecated           true = delete on next run, then safe to remove from IaC

firewall_policy:
  rules:
    # -- Trusted = admin/unfiltered --
    - name: "trusted-to-servers"
      deprecated: false
      from: ["trusted"]
      to: ["servers"]
      action: "allow"
    - name: "trusted-to-iot"
      deprecated: false
      from: ["trusted"]
      to: ["iot"]
      action: "allow"
    - name: "trusted-to-mgmt"
      deprecated: false
      from: ["trusted"]
      to: ["mgmt"]
      action: "allow"
    - name: "trusted-to-filtered-media"
      deprecated: false
      from: ["trusted"]
      to: ["media"]
      action: "allow"

    # -- Servers estate --
    - name: "servers-to-servers"
      deprecated: false
      from: ["servers"]
      to: ["servers"]
      action: "allow"
    - name: "servers-to-iot"
      deprecated: false
      from: ["servers"]
      to: ["iot"]
      action: "allow"
    - name: "servers-to-mgmt"
      deprecated: false
      from: ["servers"]
      to: ["mgmt"]
      action: "allow"
    - name: "servers-internet"
      deprecated: false
      from: ["servers"]
      to: ["internet"]
      action: "allow"

    # -- IoT --
    - name: "iot-to-broker"
      deprecated: false
      from: ["iot"]
      to: ["servers"]
      to_hosts: ["{{ ip_plan_hosts.mqtt_broker }}"]
      ports: [1883]
      proto: "tcp"
      action: "allow"
    # TEMPORARY: remove when go-e chargers replace the Huawei SCharger.
    - name: "iot-scharger-to-evcc"
      deprecated: false
      from: ["iot"]
      to: ["servers"]
      from_hosts: ["{{ ip_plan_hosts.huawei_scharger }}"]
      to_hosts: ["{{ ip_plan_hosts.evcc_container }}"]
      ports: [8887, 502, 503]
      proto: "tcp"
      action: "allow"
      temporary: true
    - name: "iot-internet"
      deprecated: false
      from: ["iot"]
      to: ["internet"]
      action: "allow"

    # -- Filtered zone (kids + media) --
    # On-demand internet kill-switches, created PAUSED (enabled:false). With no
    # explicit KidsMedia->External allow of our own, these paused blocks preempt
    # the built-in system "Allow All" when enabled from the app. MikroTik parity.
    - name: "filtered-internet-block"
      deprecated: false
      paused: true
      from: ["kids", "media"]
      to: ["internet"]
      action: "deny"
    # Kids bedtime pause: created PAUSED; enable/disable on demand from the app.
    - name: "kids-bedtime-pause"
      deprecated: false
      paused: true
      from: ["kids"]
      from_networks: ["kids"]
      to: ["internet"]
      action: "deny"

    # -- KidsMedia estate (kids + media share the zone) --
    # Intra-zone allow (custom zones default to Block All within their own zone).
    - name: "kidsmedia-to-kidsmedia"
      deprecated: false
      from: ["kids"]
      to: ["media"]   # both map to the KidsMedia zone => intra-zone allow-all
      action: "allow"
    # Kids/Media -> Servers: TrueNAS (SMB + NFSv4) + web + full Samba AD DC auth.
    # One protocol per rule; NetBIOS (137/138 udp, 139 tcp) included per request.
    - name: "kidsmedia-to-servers-tcp"
      deprecated: false
      from: ["kids", "media"]
      to: ["servers"]
      ports: [80, 443, 445, 2049, 53, 88, 135, 389, 464, 636, 3268, 3269, 139]
      proto: "tcp"
      action: "allow"
    - name: "kidsmedia-to-servers-udp"
      deprecated: false
      from: ["kids", "media"]
      to: ["servers"]
      ports: [53, 88, 123, 389, 464, 137, 138]
      proto: "udp"
      action: "allow"

    # -- VPN clients (built-in "Vpn" zone, referenced by name) --
    - name: "vpn-to-iot"
      deprecated: false
      from: ["Vpn"]
      to: ["iot"]
      action: "allow"
    # VPN -> Servers: same service set as kids/media (TrueNAS SMB+NFSv4, web, AD DC auth).
    - name: "vpn-to-servers-tcp"
      deprecated: false
      from: ["Vpn"]
      to: ["servers"]
      ports: [80, 443, 445, 2049, 53, 88, 135, 389, 464, 636, 3268, 3269, 139]
      proto: "tcp"
      action: "allow"
    - name: "vpn-to-servers-udp"
      deprecated: false
      from: ["Vpn"]
      to: ["servers"]
      ports: [53, 88, 123, 389, 464, 137, 138]
      proto: "udp"
      action: "allow"

  # WAN inbound port forwards (masquerade is implicit).
  port_forwards:
    - name: "pool-remote-ssh"
      deprecated: false
      wan_port: 2022
      to_host: "{{ ip_plan_hosts.pool_remote_access }}"
      to_port: 22
      proto: "tcp"

# ---------- Wired port profiles ----------
# Port-based VLAN assignment (no MAC/RADIUS). Unassigned access ports default to
# the Guest zone (isolated + filtered). The switch-port map lives in the overlay.
port_profiles:
  - name: "Mgmt-Access"
    deprecated: false
    native_zone: "mgmt"
    tagged_zones: []
  - name: "Trusted-Access"
    deprecated: false
    native_zone: "trusted"
    tagged_zones: []
  - name: "Servers-Access"
    deprecated: false
    native_zone: "servers"
    tagged_zones: []
  - name: "IoT-Access"
    deprecated: false
    native_zone: "iot"
    tagged_zones: []
  - name: "Media-Access"
    deprecated: false
    native_zone: "media"
    tagged_zones: []
  - name: "Guest-Access"
    deprecated: false
    native_zone: "guest"
    tagged_zones: []
  - name: "Trunk-All"
    deprecated: false
    native_zone: "mgmt"
    tagged_zones: ["trusted", "kids", "guest", "media", "servers", "iot"]

---
# Task: PREPARE MQTT BROKER config entry in .storage/core.config_entries.
#
# Scope: BROKER ONLY (host, port, username, password). MQTT entities
# (switches, sensors, lights, ...) are now defined in YAML via
# `mqtt: !include_dir_merge_list msz_mqtt_sensors` in configuration.yaml.
# They are deployed by ha-deploy-config-files.yaml and reloaded by
# ha-reload-mqtt.yaml without restarting HA Core.
#
# Ownership: only data.broker, port, username and password are managed for
# an existing entry. All other fields, including protocol and subentries,
# are preserved. A new entry is created when none exists.
#
# Why direct file editing? The Supervisor REST API does not expose a way
# to create config entries (config flows are websocket-only) and the
# /services/mqtt endpoint requires `services: mqtt:need` in the calling
# add-on manifest, which the SSH add-on does not declare. So the only
# deterministic, Ansible-driven path is to edit core.config_entries while
# HA Core is stopped.
#
# This task is preparation only -- the file write happens inside the
# stop -> write -> start block in ha-deploy-storage-and-restart.yaml.
#
# Resilience: read-only here -- cannot break running HA.

- name: Validate MQTT variables are set
  ansible.builtin.assert:
    that:
      - ha_mqtt_broker | length > 0
      - ha_mqtt_port is defined
      - ha_mqtt_username | length > 0
      - ha_mqtt_password | length > 0
    fail_msg: >
      MQTT variables are not fully defined. Set ha_mqtt_broker,
      ha_mqtt_port, ha_mqtt_username and ha_mqtt_password in the
      environment overlay (e.g. configs.private/envlocaldev/inventory/
      group_vars/home_assistant/).

# --- Read existing core.config_entries ---

- name: Check if core.config_entries exists
  ansible.builtin.stat:
    path: "{{ ha_config_path }}/.storage/core.config_entries"
  register: _config_entries_stat

- name: Read existing core.config_entries
  ansible.builtin.slurp:
    src: "{{ ha_config_path }}/.storage/core.config_entries"
  register: _config_entries_slurp
  when: _config_entries_stat.stat.exists
  no_log: true

- name: Parse existing core.config_entries
  ansible.builtin.set_fact:
    _config_entries_existing: >-
      {{ (_config_entries_slurp.content | b64decode | from_json)
         if _config_entries_stat.stat.exists
         else {
           'version': 1,
           'minor_version': 1,
           'key': 'core.config_entries',
           'data': {'entries': []}
         } }}
  no_log: true

- name: Reject ambiguous MQTT config entries
  ansible.builtin.assert:
    that:
      - _config_entries_existing.data.entries | default([]) | selectattr('domain', 'equalto', 'mqtt') | list | length <= 1
    fail_msg: "Multiple MQTT entries exist; resolve them before reconciling the broker."

- name: Extract existing MQTT entry (if any)
  ansible.builtin.set_fact:
    _mqtt_existing_entry: >-
      {{ ((_config_entries_existing.data.entries | default([]))
          | selectattr('domain', 'equalto', 'mqtt') | list | first)
         | default({}) }}
  no_log: true

# --- Reuse existing IDs / timestamps where possible ---

- name: Generate fresh entry_id (only if no existing MQTT entry)
  ansible.builtin.shell: python3 -c "import uuid; print(uuid.uuid4().hex)"
  register: _mqtt_entry_id_gen
  changed_when: false
  check_mode: false
  when: (_mqtt_existing_entry | length) == 0

- name: Build desired MQTT broker fields
  ansible.builtin.set_fact:
    _mqtt_owned_data:
      broker: "{{ ha_mqtt_broker }}"
      port: "{{ ha_mqtt_port | int }}"
      username: "{{ ha_mqtt_username }}"
      password: "{{ ha_mqtt_password }}"
  no_log: true

- name: Create MQTT entry when missing
  ansible.builtin.set_fact:
    _mqtt_base_entry:
      created_at: "{{ _now_iso }}"
      modified_at: "{{ _now_iso }}"
      data: {}
      disabled_by: null
      discovery_keys: {}
      domain: mqtt
      entry_id: "{{ _mqtt_entry_id_gen.stdout }}"
      minor_version: 1
      options: {}
      pref_disable_new_entities: false
      pref_disable_polling: false
      source: user
      subentries: []
      title: "{{ ha_mqtt_broker }}"
      unique_id: null
      version: 2
  vars:
    _now_iso: "{{ now(utc=true).isoformat() }}+00:00"
  when: _mqtt_existing_entry | length == 0
  no_log: true

- name: Merge managed fields into MQTT entry
  ansible.builtin.set_fact:
    _mqtt_new_entry: >-
      {{ (_mqtt_existing_entry if _mqtt_existing_entry | length > 0 else _mqtt_base_entry)
         | combine({'data': (_mqtt_existing_entry.data | default({}) | combine(_mqtt_owned_data))}) }}
  no_log: true

- name: Decide whether MQTT entry needs to be (re)written
  ansible.builtin.set_fact:
    _mqtt_entry_write_needed: >-
      {{ _mqtt_existing_entry != _mqtt_new_entry }}
  no_log: true

- name: Display MQTT entry diff decision
  ansible.builtin.debug:
    msg: >-
      {{ 'Managed MQTT broker fields differ — will update inside stop window.'
      if _mqtt_entry_write_needed
      else 'Managed MQTT broker fields already match — no change.' }}

- name: Build proposed core.config_entries content
  ansible.builtin.set_fact:
    _mqtt_config_entries_proposed: >-
      {{ _config_entries_existing
         | combine({
             'data': {
               'entries': (_entries[:_index] + [_mqtt_new_entry] + _entries[_index + 1:])
                 if _mqtt_existing_entry | length > 0 else (_entries + [_mqtt_new_entry])
             }
           }, recursive=True) }}
  when: _mqtt_entry_write_needed | bool
  vars:
    _entries: "{{ _config_entries_existing.data.entries | default([]) }}"
    _index: "{{ _entries.index(_mqtt_existing_entry) if _mqtt_existing_entry | length > 0 else 0 }}"
  no_log: true

- name: Mark storage changed (MQTT entry pending)
  ansible.builtin.set_fact:
    _ha_storage_changed: true
  when: _mqtt_entry_write_needed | bool

- name: MQTT preparation summary
  ansible.builtin.debug:
    msg: >-
      {{ 'MQTT broker entry prepared for ' ~ ha_mqtt_broker ~ ':' ~ ha_mqtt_port
         ~ ' (other entry fields and subentries are preserved).'
         ~ ' Write pending stop window.'
      if (_mqtt_entry_write_needed | bool)
      else 'MQTT broker entry already matches source-of-truth -- nothing to do.' }}

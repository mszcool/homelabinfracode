---
# Import a QCOW2 disk image into Incus as a VM image.
#
# Unlike ISO imports (which create custom storage volumes), QCOW2 images are
# imported via `incus image import` and become first-class Incus images that
# can be referenced by alias in Terraform's `image` field.
#
# Incus decides the image TYPE from the root file system entry inside the image
# tarball: a `rootfs.img` (qcow2 disk) => virtual-machine, a `rootfs/` tree =>
# container. This task builds a UNIFIED tarball with the qcow2 as rootfs.img so
# the result is always a VM image.  This task file generates the metadata
# automatically in a temporary directory before importing.
#
# Expected variables:
#   qcow2.name           - Image alias in Incus (e.g., "haos-17.1")
#   qcow2.source_local   - Local filesystem path to the QCOW2 file
#   qcow2.source_url     - (Optional) Download URL; used only for documentation
#   qcow2.project        - (Optional) Incus project; defaults to default_incus_project
#   qcow2.architecture   - (Optional) CPU architecture; defaults to "x86_64"
#   qcow2.description    - (Optional) Image description; defaults to "<name> VM image"
#   incus_remote_name     - Target Incus remote

- name: Determine target project for QCOW2 image
  ansible.builtin.set_fact:
    qcow2_target_project: "{{ qcow2.project | default(default_incus_project) }}"
  delegate_to: localhost
  become: false

- name: Validate local QCOW2 source is provided
  ansible.builtin.fail:
    msg: |
      ERROR: Local QCOW2 source is required but not provided for image '{{ qcow2.name }}'.
      
      Image configuration: {{ qcow2 }}
      
      Please ensure 'source_local' is defined in your qcow2_images configuration.
      {% if qcow2.source_url is defined and qcow2.source_url != "" %}
      
      You can download the file with:
        curl -fSL -o {{ qcow2.source_local | default('<target-path>') }} {{ qcow2.source_url }}
      {% endif %}
  when: qcow2.source_local is not defined or qcow2.source_local == ""
  delegate_to: localhost
  become: false

- name: Check if local QCOW2 source file exists
  ansible.builtin.stat:
    path: "{{ qcow2.source_local }}"
  register: qcow2_local_stat
  delegate_to: localhost
  become: false

- name: Fail if local QCOW2 file doesn't exist
  ansible.builtin.fail:
    msg: |
      ERROR: Local QCOW2 file not found: {{ qcow2.source_local }}
      
      Please ensure the file exists on your local machine.
      {% if qcow2.source_url is defined and qcow2.source_url != "" %}
      
      Download it with:
        curl -fSL -o {{ qcow2.source_local }} {{ qcow2.source_url }}
      
      If the file is compressed (.xz or .gz), decompress it first:
        xz -dk {{ qcow2.source_local }}.xz
      {% endif %}
  when: not qcow2_local_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Check if image alias already exists on target remote
  ansible.builtin.shell: |
    incus image show {{ incus_remote_name }}:{{ qcow2.name }} --project={{ qcow2_target_project }} 2>/dev/null
  register: qcow2_image_exists
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false

- name: Skip import if image already exists
  ansible.builtin.debug:
    msg: "Image '{{ qcow2.name }}' already exists on {{ incus_remote_name }} (project {{ qcow2_target_project }}), skipping import."
  when: qcow2_image_exists.rc == 0
  delegate_to: localhost
  become: false

- name: Import QCOW2 image into Incus (creates VM image with alias)
  ansible.builtin.shell: |
    set -e
    TMPDIR=$(mktemp -d)
    trap 'rm -rf "$TMPDIR"' EXIT

    # Generate the metadata.yaml required by incus image import
    cat > "$TMPDIR/metadata.yaml" <<EOF
    architecture: {{ qcow2.architecture | default('x86_64') }}
    creation_date: $(date +%s)
    properties:
      description: {{ qcow2.description | default(qcow2.name + ' VM image') }}
      os: Linux
      release: {{ qcow2.name }}
    EOF

    # Build a UNIFIED image tarball. Incus decides the image TYPE from the root
    # file system entry: a `rootfs.img` => virtual-machine, whereas a `rootfs/`
    # dir/tarball => container. A split import of a bare disk is ambiguous and
    # Incus registers it as a CONTAINER. Incus ALSO requires rootfs.img to be
    # qcow2-formatted.
    SRC="{{ qcow2.source_local }}"
    command -v qemu-img >/dev/null 2>&1 || { echo "ERROR: qemu-img (qemu-utils) is required on the control host. Run playbooks/prepare-localhost.yaml."; exit 1; }

    # Auto-decompress a compressed source. Detected by CONTENT (magic bytes), not
    # by filename, so a compressed disk still works even if it is misnamed .qcow2.
    # This matters because qemu-img does NOT understand .xz/.gz and silently
    # mislabels such a file as a bogus 'raw' disk (e.g. a 510 MiB .xz shows up as a
    # 510 MiB raw disk), which then imports as an unbootable VM. The decompressed
    # disk is written into the temp dir and used from there.
    HDR=$(dd if="$SRC" bs=1 count=6 2>/dev/null | od -An -tx1 | tr -d ' \n')
    case "$HDR" in
      fd377a585a00*)  # xz
        command -v xz >/dev/null 2>&1 || { echo "ERROR: source is xz-compressed but 'xz' (xz-utils) is not installed on the control host."; exit 1; }
        echo "Source is xz-compressed; decompressing..."; xz -dc "$SRC" > "$TMPDIR/source.disk"; SRC="$TMPDIR/source.disk" ;;
      1f8b*)          # gzip
        command -v gzip >/dev/null 2>&1 || { echo "ERROR: source is gzip-compressed but 'gzip' is not installed on the control host."; exit 1; }
        echo "Source is gzip-compressed; decompressing..."; gzip -dc "$SRC" > "$TMPDIR/source.disk"; SRC="$TMPDIR/source.disk" ;;
      425a68*)        # bzip2
        command -v bzip2 >/dev/null 2>&1 || { echo "ERROR: source is bzip2-compressed but 'bzip2' is not installed on the control host."; exit 1; }
        echo "Source is bzip2-compressed; decompressing..."; bzip2 -dc "$SRC" > "$TMPDIR/source.disk"; SRC="$TMPDIR/source.disk" ;;
      504b0304*)      # zip
        echo "ERROR: '$SRC' is a .zip archive; extract the disk image and point source_local at the extracted file."; exit 1 ;;
    esac

    # Detect the real disk format and ensure rootfs.img is qcow2. If already qcow2,
    # package by reference (tar -h derefs the symlink, no multi-GB copy); otherwise
    # convert to qcow2 forcing the detected source format so it is never mis-probed.
    FMT=$(qemu-img info "$SRC" 2>/dev/null | awk -F': ' '/^file format:/{print $2; exit}')
    if [ -z "$FMT" ]; then
      echo "ERROR: qemu-img cannot read '$SRC' as a disk image. Make sure it is a real disk image (e.g. the official haos_ova-*.qcow2)."; exit 1
    fi
    if [ "$FMT" = "qcow2" ]; then
      ln -s "$SRC" "$TMPDIR/rootfs.img"
      tar -chf "$TMPDIR/unified.tar" -C "$TMPDIR" metadata.yaml rootfs.img
    else
      qemu-img convert -f "$FMT" -O qcow2 "$SRC" "$TMPDIR/rootfs.img"
      tar -cf "$TMPDIR/unified.tar" -C "$TMPDIR" metadata.yaml rootfs.img
    fi

    # Import the unified VM image
    incus image import "$TMPDIR/unified.tar" {{ incus_remote_name }}: \
      --alias {{ qcow2.name }} --project={{ qcow2_target_project }}
  delegate_to: localhost
  become: false
  register: qcow2_import_result
  when: qcow2_image_exists.rc != 0

- name: Display QCOW2 import information
  ansible.builtin.debug:
    msg: |
      QCOW2 Import {{ 'Successful' if qcow2_image_exists.rc != 0 else 'Skipped (already exists)' }}:
      Image Alias: {{ qcow2.name }}
      Local Source: {{ qcow2.source_local }}
      Project: {{ qcow2_target_project }}
      Remote: {{ incus_remote_name }}
      {% if qcow2.source_url is defined and qcow2.source_url != "" %}
      Source URL: {{ qcow2.source_url }}
      {% endif %}
  delegate_to: localhost
  become: false

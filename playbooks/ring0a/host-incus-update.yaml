---
- name: Baseline for each Incus node
  hosts: incus
  become: true
  gather_facts: true

  vars:
    param_incus_config: "{{ incus_config }}"
    # Managed NAT bridge created by the Incus preseed (see the incus preseed
    # template). Instances on this bridge rely on the host's dnsmasq for DHCP/DNS.
    incus_nat_bridge: "iso-nat"

  tasks:
    - name: Set the hostname from inventory.
      ansible.builtin.set_fact:
        param_hostname: "{{ hostvars[inventory_hostname]['hostname'] }}"

    - name: Set the hostname to the value from inventory.
      ansible.builtin.hostname:
        name: "{{ param_hostname }}"

    - name: If the root user password is provided, set input variable for the password generation tasks.
      ansible.builtin.set_fact:
        generate_password_input: "{{ incus_root_user_password | default('') }}"
      when: incus_root_user_password is defined and incus_root_user_password | default('') | length > 0
      no_log: true

    - name: If the root user password is set, update the password.
      ansible.builtin.user:
        name: "{{ incus_root_user }}"
        password: "{{ generate_password_input | password_hash('sha512') }}"
      when: generate_password_input is defined and generate_password_input | length > 0

    - name: Set the Incus server admin SSH Key exclusively.
      ansible.posix.authorized_key:
        user: "{{ incus_root_user }}"
        state: present
        key: "{{ incus_root_user_publickey }}"
        exclusive: true

    - name: Allow host-directed inbound services on all interfaces (e.g. SSH, Incus API).
      # Host-wide INPUT allows that must be reachable from the management LAN. The
      # ports come from inventory (incus_host_input_services — a safe default in
      # envbase); the Incus management API port is appended from incus_config so it
      # always tracks the daemon's configured port. These are deliberately NOT
      # interface-scoped, unlike the NAT-bridge services below.
      # SAFETY: the play later sets default-deny-incoming and enables UFW, so SSH
      # (22) MUST remain in incus_host_input_services or the node becomes
      # unreachable from the LAN.
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto | default(omit) }}"
      loop: "{{ incus_host_input_services + [{'port': param_incus_config.port | string, 'proto': 'tcp'}] }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto | default('any') }}"

    - name: Allow host services (DHCP, DNS) requested from the isolated NAT bridge.
      # Host-directed traffic from the isolated NAT bridge is deliberately limited
      # to the services the host actually provides to those instances — dnsmasq
      # DHCP + DNS (incus_nat_bridge_host_services, a safe default in envbase).
      # Incus installs its own nftables accept rules for these, but UFW registers
      # separate base chains on the same input hook with a default-drop policy, and
      # nftables evaluates every base chain on a hook independently — so without an
      # explicit UFW allow, UFW silently drops the DHCP DISCOVER before dnsmasq can
      # answer and instances never obtain an IP. Interface-scoping (instead of a
      # blanket host allow) keeps other host services (e.g. SSH) unreachable from
      # the isolated instances. An entry with no proto matches both TCP and UDP.
      community.general.ufw:
        rule: allow
        direction: in
        interface: "{{ incus_nat_bridge }}"
        to_port: "{{ item.to_port }}"
        proto: "{{ item.proto | default(omit) }}"
      loop: "{{ incus_nat_bridge_host_services }}"
      loop_control:
        label: "{{ incus_nat_bridge }} in -> :{{ item.to_port }}/{{ item.proto | default('any') }}"

    - name: Deny forwarding from the isolated NAT bridge to private LAN ranges.
      # Egress from the isolated NAT bridge (forward hook): deny reaching the
      # private LAN/prod ranges so a compromised dev instance cannot pivot into the
      # local network, then allow everything else (internet) via NAT below. The
      # ranges come from inventory (incus_nat_egress_denied_ranges — a safe default
      # in envbase). The deny rules are declared before the allow so they take
      # precedence in UFW's ordered ruleset. The bridge's own subnet is unaffected:
      # instance-to-host and instance-to-instance traffic stays on the bridge
      # (input hook / L2) and never traverses this forward chain.
      community.general.ufw:
        route: true
        rule: deny
        direction: in
        interface: "{{ incus_nat_bridge }}"
        dest: "{{ item }}"
      loop: "{{ incus_nat_egress_denied_ranges }}"

    - name: Allow forwarding from the isolated NAT bridge to the internet (via NAT).
      # NAT egress traverses the forward hook, where UFW's FORWARD chain also
      # defaults to drop. UFW's before-forward chain already accepts established/
      # related traffic, so allowing forwarding inbound from the bridge (minus the
      # denied LAN ranges above) is enough for the masqueraded outbound path and
      # its return traffic to work.
      community.general.ufw:
        route: true
        rule: allow
        direction: in
        interface: "{{ incus_nat_bridge }}"

    - name: Set default policy to deny inbound traffic.
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default policy to allow outbound traffic.
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW firewall.
      community.general.ufw:
        state: enabled

    - name: Get the host configuration for this server.
      ansible.builtin.set_fact:
        param_host_config: "{{ host_configs | selectattr('name', 'equalto', hostvars[inventory_hostname]['host_config_name']) | first }}"

    - name: Get the network adapter name from host configuration.
      ansible.builtin.set_fact:
        param_network_adapter: "{{ param_host_config.network_config.physical_network_parent }}"

    - name: Gather IP address of the physical network adapter.
      ansible.builtin.set_fact:
        param_incus_listen_address: "{{ hostvars[inventory_hostname]['ansible_' + param_network_adapter]['ipv4']['address'] }}"

    - name: Configure Incus to listen on the network address and port.
      ansible.builtin.command:
        cmd: "incus config set core.https_address {{ param_incus_listen_address }}:{{ param_incus_config.port }}"
      register: incus_config_result
      changed_when: incus_config_result.rc == 0

    - name: Display Incus network configuration.
      ansible.builtin.debug:
        msg: "Incus is now accessible at https://{{ param_incus_listen_address }}:{{ param_incus_config.port }}"

    # ---------- Incus network LAN port-forwards (dev services on iso-nat) ----------
    # Publish selected service ports of NAT'd instances on the node's LAN IP via
    # Incus network forwards (DNAT) and open the matching UFW route rules
    # (restricted to source_subnet). Driven by incus_network_forwards in the
    # incus-group group_vars. The current entries expose the dev iso-nat services;
    # a no-op where undefined.
    - name: Manage Incus network LAN port-forwards.
      ansible.builtin.include_tasks: ./tasks/host-incus-network-forwards-tasks.yaml
      when: incus_network_forwards | default([]) | length > 0
      tags:
        - network-forwards
        - network

    - name: Validate and rotate Incus server certificate if needed.
      ansible.builtin.include_tasks: ./tasks/host-incus-validate-server-cert-tasks.yaml
      tags:
        - cert-validation
        - server-cert

    - name: Manage trusted client certificates if configuration exists.
      ansible.builtin.include_tasks: ./tasks/host-incus-manage-client-cert-tasks.yaml
      when: 
        - incus_trusted_clients is defined
        - incus_trusted_clients | length > 0
      tags:
        - client-certs

    # ---------- Zabbly repository and Incus version management ----------
    - name: Install Zabbly GPG key.
      ansible.builtin.get_url:
        url: https://pkgs.zabbly.com/key.asc
        dest: /etc/apt/keyrings/zabbly.asc
        mode: "0644"
      when: incus_zabbly_enabled | default(false) | bool
      tags:
        - incus-upgrade
        - zabbly

    - name: Add Zabbly Incus repository.
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/zabbly-incus-{{ incus_zabbly_channel | default('stable') }}.sources
        mode: "0644"
        content: |
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/{{ incus_zabbly_channel | default('stable') }}
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: main
          Architectures: {{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') }}
          Signed-By: /etc/apt/keyrings/zabbly.asc
      when: incus_zabbly_enabled | default(false) | bool
      tags:
        - incus-upgrade
        - zabbly

    - name: Update apt cache after adding Zabbly repository.
      ansible.builtin.apt:
        update_cache: true
      when: incus_zabbly_enabled | default(false) | bool
      tags:
        - incus-upgrade
        - zabbly

    - name: Install specific Incus version from Zabbly.
      ansible.builtin.apt:
        name: "incus={{ incus_version }}*"
        state: present
        allow_change_held_packages: true
      when:
        - incus_zabbly_enabled | default(false) | bool
        - incus_version | default('') | length > 0
      tags:
        - incus-upgrade
        - zabbly

    - name: Install latest Incus from Zabbly channel.
      ansible.builtin.apt:
        name: incus
        state: latest
        allow_change_held_packages: true
      when:
        - incus_zabbly_enabled | default(false) | bool
        - incus_version | default('') | length == 0
      tags:
        - incus-upgrade
        - zabbly

    - name: Verify Incus version after upgrade.
      ansible.builtin.command:
        cmd: incus version
      register: incus_version_result
      changed_when: false
      when: incus_zabbly_enabled | default(false) | bool
      tags:
        - incus-upgrade
        - zabbly

    - name: Display Incus version.
      ansible.builtin.debug:
        msg: "Incus version on {{ inventory_hostname }}: {{ incus_version_result.stdout }}"
      when:
        - incus_zabbly_enabled | default(false) | bool
        - incus_version_result is defined
      tags:
        - incus-upgrade
        - zabbly

    - name: Update and upgrade the operating system.
      ansible.builtin.include_tasks: ../tasks/upgrade_tasks.yaml
      tags:
        - upgrade
